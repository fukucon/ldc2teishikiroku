<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<title>停止記録</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e3e6eb;
    --text: #1f2328;
    --muted: #6e7681;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --warn: #d97706;
    --error: #dc2626;
    --success: #059669;
    --col-2l: #2563eb;
    --col-500: #0d9488;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }
  body { min-height: 100vh; padding-bottom: 60px; }

  /* ── トップバー ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  .top-row {
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    background: transparent; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; min-height: 40px;
    cursor: pointer; font: inherit; color: var(--text);
  }
  .back-btn:hover { background: #f1f3f4; }
  .cycle-title {
    flex: 1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .cycle-title .line-badge {
    font-size: 16px; font-weight: 700;
    padding: 3px 12px; border-radius: 6px;
  }
  .cycle-title.line-2L .line-badge { background: #dbeafe; color: var(--col-2l); }
  .cycle-title.line-500ml .line-badge { background: #ccfbf1; color: var(--col-500); }
  .cycle-title .date { font-size: 18px; font-weight: 600; }
  .cycle-title .id  {
    font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace;
  }

  /* ── 汎用モーダル ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-dialog {
    background: var(--surface);
    border-radius: 12px;
    padding: 24px 20px 20px;
    max-width: 360px; width: 100%;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  .modal-icon {
    text-align: center; font-size: 36px; margin-bottom: 8px;
  }
  .modal-message {
    font-size: 15px; line-height: 1.6;
    margin-bottom: 18px;
    text-align: center; color: var(--text);
    white-space: pre-wrap;
  }
  .modal-actions {
    display: flex; justify-content: center; gap: 8px;
  }

  /* ── 確定ボタン / バッジ ── */
  .confirm-area {
    display: inline-flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }
  .btn-confirm {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 14px; border-radius: 6px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    min-height: 34px; white-space: nowrap;
  }
  .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
  .confirm-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: #d1fae5; color: #065f46;
    border: 1px solid #6ee7b7;
    white-space: nowrap;
  }

  /* ── 一覧に戻るボタン ── */
  .back-btn {
    display: inline-flex; align-items: center;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--surface);
    color: var(--accent);
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .back-btn:hover { background: #eff6ff; }

  /* ── 強制再取得ボタン ── */
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 999px;          /* ピル形状 */
    background: var(--surface);
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    line-height: 1;
  }
  .refresh-btn:hover { background: #f1f3f4; }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .refresh-label {
    font-size: 13px; font-weight: 700;
  }
  .refresh-icon {
    display: inline-block;
    font-size: 16px; line-height: 1;
  }
  /* くるくる回るのは ↻ アイコンのみ */
  .refresh-btn.refreshing .refresh-icon {
    animation: refresh-spin 0.7s linear infinite;
    color: var(--accent);
  }
  @keyframes refresh-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── 接続状態インジケータ ── */
  .conn-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    padding: 6px 10px; border-radius: 999px;
    background: #f1f3f4;
    white-space: nowrap; flex-shrink: 0;
  }
  .conn-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #9ca3af; transition: background 0.2s, box-shadow 0.2s;
  }
  .conn-status.online { color: #065f46; background: #d1fae5; }
  .conn-status.online .conn-dot {
    background: var(--success); box-shadow: 0 0 0 3px rgba(5,150,105,0.18);
  }
  .conn-status.offline { color: #991b1b; background: #fee2e2; }
  .conn-status.offline .conn-dot {
    background: var(--error); box-shadow: 0 0 0 3px rgba(220,38,38,0.18);
  }
  .conn-status .conn-text-small {
    font-size: 10px; opacity: 0.8;
  }

  /* ── スティッキー上部バー（製造時間 + 停止記録の追加） ── */
  .top-bar-row {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 6px 14px 8px;
    border-top: 1px solid var(--border);
  }
  .add-bar-inline {
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    padding: 4px 10px;
    background: #f3f4f6;
    border-radius: 6px;
  }
  .add-bar-title {
    font-size: 14px; font-weight: 700; color: var(--accent);
    white-space: nowrap;
  }
  .add-bar-inline select,
  .add-bar-inline input[type="time"] {
    font-size: 14px; font-weight: 700;
    min-height: 36px; padding: 4px 6px;
    border: 1px solid #d1d5db; border-radius: 5px;
  }
  .add-bar-inline select { width: 56px; min-width: 56px; }
  .add-bar-inline input[type="time"] {
    width: 110px; min-width: 110px;   /* Safari 空欄時の縮みを防ぐ */
  }
  /* ＋停止 内の time-pair select も日付セレクタと同じ高さに揃える */
  .add-bar-inline .time-pair > select {
    min-height: 36px;
    padding: 4px 6px;
  }
  .add-bar-inline .btn-add-small {
    padding: 3px 14px;
    min-height: 28px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    border-radius: 5px;
  }
  .add-bar-product {
    display: inline-flex; align-items: center; gap: 6px;
    padding-left: 8px; margin-left: 4px;
    border-left: 1px solid #d1d5db;
  }
  .add-bar-product-label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .add-bar-product select {
    font-size: 14px; font-weight: 700;
    min-height: 30px; padding: 4px 6px;
    border: 1px solid #d1d5db; border-radius: 5px;
    min-width: 110px;
  }

  /* ── 月日(紫) / 開始時刻(青) / 終了・停止時刻(赤) の色分け ── */
  /* 月/日 セレクタは紫枠 */
  #prod-end-month, #prod-end-day,
  #stop-day-month, #stop-day-day,
  .record-header .rec-stop-month, .record-header .rec-stop-day {
    border-color: #a855f7;
  }
  /* 停止/終了系 時刻(時:分) は赤枠 */
  #prod-end-hour, #prod-end-minute,
  #stop-stop-hour, #stop-stop-minute,
  .record-header [data-field="stopHour"],
  .record-header [data-field="stopMinute"] {
    border-color: #ef4444;
  }
  /* 開始/スタート系 時刻(時:分) は青枠 */
  #prod-start-hour, #prod-start-minute,
  .record-header [data-field="startHour"],
  .record-header [data-field="startMinute"] {
    border-color: #3b82f6;
  }

  /* 停止記録 各行 右端の商品バッジ */
  .record-product {
    font-size: 12px; font-weight: 700;
    padding: 3px 8px;
    background: #dbeafe; color: #1e40af;
    border: 1px solid #93c5fd; border-radius: 4px;
    white-space: nowrap;
  }
  .record-product.empty {
    color: var(--muted); background: #f3f4f6; border-color: #e5e7eb;
  }
  .record-product-arrow {
    color: #1e40af; font-weight: 700; font-size: 13px;
  }
  .record-product-select {
    width: auto; min-width: 90px; max-width: 140px;
    font-size: 12px; font-weight: 700;
    min-height: 28px; padding: 2px 6px;
    border: 1px solid #93c5fd; border-radius: 4px;
    background: #fff; color: #1e40af;
  }

  /* 時刻 (時:分) のセレクタペア */
  .time-pair {
    display: inline-flex; align-items: center; gap: 2px;
  }
  .time-pair > .colon {
    font-weight: 700; color: var(--muted);
  }
  .time-pair > select {
    font-size: 14px; font-weight: 700;
    min-height: 30px; padding: 2px 4px;
    width: 56px; min-width: 56px;
    border: 1px solid #d1d5db; border-radius: 5px;
    text-align: center;
  }
  .prod-time-line .time-pair > select {
    min-height: 34px; padding: 2px 6px;
  }

  /* 商品切替 UI (停止記録カード内) */
  .record-switch {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; margin-bottom: 8px;
    background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px;
    font-size: 13px; flex-wrap: wrap;
  }
  .record-switch-label { font-weight: 700; color: #92400e; }
  .record-switch-from {
    font-weight: 700; padding: 2px 8px;
    background: var(--surface); border: 1px solid #fcd34d; border-radius: 4px;
  }
  .record-switch-arrow { color: #92400e; font-weight: 700; font-size: 15px; }
  .record-switch select {
    flex: 1; min-width: 140px;
    font-size: 13px; font-weight: 700;
    min-height: 32px; padding: 4px 8px;
    border: 1px solid #d1d5db; border-radius: 5px;
  }

  /* ── セクション ── */
  main {
    max-width: 920px; margin: 0 auto; padding: 16px;
  }
  .section {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .section-title {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin: 0 0 12px;
  }

  /* ── フォーム共通 ── */
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  /* 追加フォーム: 停止日 + ストップ時刻 (横並び、Safari overflow対策) */
  .add-time-row {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: end;
    margin-bottom: 16px;
  }
  .date-inline { display: flex; gap: 6px; align-items: center; }
  .add-time-row select,
  .add-time-row input[type="time"] { width: auto; }
  .add-time-row select { min-width: 75px; padding: 10px 8px; }
  .add-time-row input[type="time"] { width: 140px; min-width: 0; }

  input[type="text"], input[type="number"], input[type="time"],
  select, textarea {
    font: inherit; width: 100%;
    padding: 10px 12px; min-height: 44px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface);
  }
  input:focus, select:focus, textarea:focus, input[type="time"]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .info-note { font-size: 12px; color: var(--muted); }

  /* 製造時間（ヘッダーに統合された行） */
  .prod-time-line {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; font-size: 16px;
    justify-content: center;
  }
  .prod-section-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    flex-shrink: 0;
  }
  .prod-group {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border: none;
    background: #f3f4f6;       /* 薄いグレーでグループ感 */
    border-radius: 6px;
    flex-shrink: 0;
  }
  .prod-group.prod-start { /* 外枠は無し、ラベルだけ青 */ }
  .prod-group.prod-end   { /* 外枠は無し、ラベルだけ赤 */ }
  .prod-label { font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .prod-group.prod-start .prod-label { color: #1d4ed8; }
  .prod-group.prod-end   .prod-label { color: #b91c1c; }
  .prod-date-display {
    font-size: 16px; font-weight: 700;
    padding: 0 2px;
    background: transparent; border-radius: 0; color: var(--text);
  }
  .prod-separator { color: var(--muted); font-size: 16px; flex-shrink: 0; }
  .prod-time-line select,
  .prod-time-line input[type="time"] {
    min-height: 34px; padding: 2px 6px;
    font-size: 14px; font-weight: 700;
    border: 1px solid #d1d5db; border-radius: 5px;
  }
  .prod-time-line select { width: 56px; min-width: 56px; }
  .prod-time-line input[type="time"] {
    width: 105px; min-width: 105px;  /* Safari 空欄時の縮みを防ぐ */
  }

  .save-indicator {
    width: 10px; height: 10px; border-radius: 50%;
    background: #d1d5db;        /* グレー: 待機 */
    display: inline-block; vertical-align: middle;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .save-indicator.saving { background: #facc15; }   /* 黄: 保存中 */
  .save-indicator.saved  { background: #3b82f6; }   /* 青: 保存完了 */
  .save-indicator.error  { background: #dc2626; }   /* 赤: エラー */

  /* 停止記録 追加フォーム */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .minutes-display {
    font-size: 16px; font-weight: 700; color: var(--text);
    background: #f1f5f9; border-radius: 6px; padding: 8px 12px;
    display: inline-block; min-width: 80px; text-align: center;
  }
  .radio-group {
    display: flex; gap: 6px;
  }
  .radio-option {
    flex: 1; text-align: center; padding: 10px;
    border: 2px solid var(--border); border-radius: 8px;
    cursor: pointer; font-weight: 500; font-size: 14px;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .radio-option.selected {
    border-color: var(--accent); background: #eff6ff; color: var(--accent);
    font-weight: 700;
  }

  .btn-primary {
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    padding: 12px 22px; min-height: 48px;
    border-radius: 8px; font-weight: 700; font-size: 15px;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; cursor: pointer;
  }

  .error-text { color: var(--error); font-size: 13px; margin-top: 8px; }

  /* 停止記録一覧 (各カードで全項目編集可) */
  .record-list { display: flex; flex-direction: column; gap: 6px; }
  .record-item {
    background: #fafbfc;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px;
  }
  .record-item.unfinished { background: #fffbeb; border-color: #fde68a; }

  .record-header {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
    padding-bottom: 5px; margin-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .record-header .arrow { color: var(--muted); font-size: 14px; }
  .record-header .rec-stop-month,
  .record-header .rec-stop-day {
    font-size: 13px; font-weight: 700;
    width: 42px; min-width: 42px;
    min-height: 30px; padding: 2px 2px;
    border: 1px solid #d1d5db; border-radius: 5px;
    text-align: center;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: none;
  }
  /* 停止記録カード内の time-pair も ▼ を非表示にして詰める */
  .record-header .time-pair > select {
    width: 44px; min-width: 44px;
    padding: 2px 2px;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: none;
  }
  .record-header .rec-stop-slash {
    color: var(--muted); font-weight: 700;
  }
  .record-date {
    font-size: 13px; font-weight: 700; color: var(--muted);
    font-family: ui-monospace, monospace;
  }
  .record-minutes {
    font-size: 12px; font-weight: 700; color: var(--accent);
    background: #eff6ff; padding: 2px 8px; border-radius: 5px;
    min-width: 52px; text-align: center;
  }
  .record-minutes.pending { color: var(--muted); background: #f3f4f6; }

  .record-fields-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px 8px;
  }
  .record-fields-grid .field-label { font-size: 11px; margin-bottom: 1px; }
  .record-fields-grid input,
  .record-fields-grid select {
    font-size: 13px;
    min-height: 30px;
    padding: 3px 6px;
  }
  .record-fields-grid .radio-group { gap: 3px; }
  .record-fields-grid .radio-option {
    padding: 3px 2px;
    font-size: 12px;
    min-height: 30px;
    border-width: 1px;
  }
  .rec-ind {
    width: 10px; height: 10px; border-radius: 50%;
    background: #d1d5db;        /* グレー: 待機 */
    flex-shrink: 0;
    display: inline-block; vertical-align: middle;
    pointer-events: none;
    transition: background 0.15s;
  }
  .rec-ind.saving { background: #facc15; }   /* 黄: 保存中 */
  .rec-ind.saved  { background: #3b82f6; }   /* 青: 保存完了 */
  .rec-ind.error  { background: #dc2626; }   /* 赤: エラー */

  /* 入力 + ドットを横並びに配置（行ずれ防止） */
  .field-input-wrap {
    display: flex; align-items: center; gap: 6px;
    width: 100%;
  }
  .record-fields-grid .field-input-wrap > input,
  .record-fields-grid .field-input-wrap > select,
  .record-fields-grid .field-input-wrap > .radio-group {
    flex: 1; min-width: 0;
  }
  .empty-records {
    text-align: center; padding: 24px; color: var(--muted); font-size: 13px;
  }

  /* UF温度 / TEA温度 入力は半分の幅 */
  .record-fields-grid input[data-field="ufTemp"],
  .record-fields-grid input[data-field="teaTemp"] {
    max-width: 70px;
    flex: 0 0 70px;
  }

  /* 削除ボタン (各カード行2の右端) */
  .record-body {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .record-body > .record-fields-grid {
    flex: 1; min-width: 0;
  }
  .record-delete-btn {
    flex-shrink: 0;
    align-self: flex-end;
    padding: 4px 12px;
    border: 1px solid #dc2626;
    background: #fff;
    color: #dc2626;
    border-radius: 5px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .record-delete-btn:hover { background: #fef2f2; }
  @media (max-width: 700px) {
    .record-body { display: block; }
    .record-delete-btn {
      display: block;
      width: 100%;
      margin: 8px 0 0;
    }
  }

  /* モーダル: 危険操作用ボタン */
  .btn-danger {
    background: #dc2626; color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  .btn-danger:hover { background: #b91c1c; }
  .modal-message.danger { color: #dc2626; font-weight: 700; }

  /* 同期インジケータ */
  #sync-indicator {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 16px; font-size: 13px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
    z-index: 20;
  }

  /* ローディング */
  .skeleton {
    height: 18px; background: linear-gradient(90deg, #eef0f3 0%, #f7f8fa 50%, #eef0f3 100%);
    background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 4px;
  }
  @keyframes shimmer {

</style>

<!-- datalist（ページ全体で共有） -->

<main>

      <div class="empty-records">読み込み中…</div>
    </div>
  </section>

<div id="sync-indicator">
  <span id="sync-text">未送信: 0件</span>
  <span id="sync-time" style="font-size: 11px;"></span>
</div>

<!-- 汎用モーダル -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="onModalOverlayClick(event)">
  <div class="modal-dialog">
    <div class="modal-icon" id="modal-icon">⚠</div>
    <div class="modal-message" id="modal-message"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="hideModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
const APP_URL = '<?= appUrl ?>';
const CYCLE_ID = '<?= cycleID ?>';

const STATE = {
  cycle: null,
  stopRecords: [],
  masters: null,
  products: [],
  lastProducts: {},  // { '2L': 'P001', '500ml': 'P004' }
  userEmail: ''
};

// +停止 バーの 月/日/時/分 をユーザーが手動で変えたか
let stopTimeManual = false;

// localStorage キャッシュ（マスタ・商品）
const MASTERS_LS_KEY  = 'cached_masters_v1';
const PRODUCTS_LS_KEY = 'cached_products_v1';
function loadCachedMasters() {
  try {
    const raw = localStorage.getItem(MASTERS_LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveCachedMasters(masters) {
  try { localStorage.setItem(MASTERS_LS_KEY, JSON.stringify(masters)); } catch (e) {}
}
function loadCachedProducts() {
  try {
    const raw = localStorage.getItem(PRODUCTS_LS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveCachedProducts(products) {
  try { localStorage.setItem(PRODUCTS_LS_KEY, JSON.stringify(products)); } catch (e) {}
}

function gas(method, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => { setOnlineStatus(true); resolve(r); })
      .withFailureHandler(e => { setOnlineStatus(false); reject(e); })
      [method](...args);
  });
}

// =====================================================
//  接続状態インジケータ + 自動更新
// =====================================================
const POLL_INTERVAL_MS = 15000;
let pollTimer = null;

function setOnlineStatus(online) {
  const el = document.getElementById('conn-status');
  const txt = document.getElementById('conn-text');
  if (!el) return;
  el.classList.toggle('online', !!online);
  el.classList.toggle('offline', !online);
  if (online) {
    const now = new Date();
    txt.innerHTML = 'オンライン <span class="conn-text-small">' +
      String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') + ':' +
      String(now.getSeconds()).padStart(2, '0') + '</span>';
  } else {
    txt.textContent = 'オフライン';
  }
}

function startAutoRefresh() {
  stopAutoRefresh();
  pollTimer = setInterval(() => {
    if (document.hidden) return;
    pollUpdate();
  }, POLL_INTERVAL_MS);
}

function stopAutoRefresh() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function pollUpdate() {
  if (!CYCLE_ID || !STATE.cycle) return;
  gas('api_getCycleDetail', CYCLE_ID).then(res => {
    if (res && res.success) softMerge(res);
  }).catch(() => {
    // 失敗時は setOnlineStatus(false) が gas() 内で実行される
  });
}

// 手動更新: サーバーキャッシュをクリアしてから取得
function manualRefresh() {
  const btn = document.getElementById('refresh-btn');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('refreshing');
  let failed = false;
  gas('api_invalidateCaches')
    .then(() => gas('api_getCycleDetail', CYCLE_ID))
    .then(res => {
      if (res && res.success) softMerge(res);
      else failed = true;
    })
    .catch(() => { failed = true; })
    .finally(() => {
      btn.disabled = false;
      btn.classList.remove('refreshing');
      if (failed) {
        showModal('通信状態が不安定なため、時間をおいて更新ボタンを押してください。', '⚠');
      }
    });
}

// 汎用モーダル
// 互換シグネチャ: showModal(message, icon) または showModal(message, options)
// options: { icon, danger:bool, confirm:fn, confirmLabel, cancelLabel }
function showModal(message, iconOrOptions) {
  const opts = (typeof iconOrOptions === 'string' || iconOrOptions == null)
    ? { icon: iconOrOptions }
    : iconOrOptions;
  const overlay = document.getElementById('modal-overlay');
  const msgEl = document.getElementById('modal-message');
  msgEl.textContent = message || '';
  msgEl.classList.toggle('danger', !!opts.danger);
  document.getElementById('modal-icon').textContent = opts.icon || '';

  const actions = overlay.querySelector('.modal-actions');
  if (opts.confirm) {
    actions.innerHTML = '';
    const cancel = document.createElement('button');
    cancel.className = 'btn-secondary';
    cancel.textContent = opts.cancelLabel || 'キャンセル';
    cancel.onclick = hideModal;
    const yes = document.createElement('button');
    yes.className = opts.danger ? 'btn-danger' : 'btn-primary';
    yes.textContent = opts.confirmLabel || 'OK';
    yes.onclick = () => { hideModal(); opts.confirm(); };
    actions.appendChild(cancel);
    actions.appendChild(yes);
  } else {
    actions.innerHTML = '<button class="btn-primary" onclick="hideModal()">閉じる</button>';
  }
  overlay.classList.remove('hidden');
}
function hideModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  // 後始末: danger クラスを外す
  document.getElementById('modal-message').classList.remove('danger');
}
function onModalOverlayClick(e) {
  if (e.target.id === 'modal-overlay') hideModal();
}

// 停止記録の削除（確認モーダル → 実行）
function confirmDeleteRecord(logID) {
  showModal('この操作は取り消せません。\n削除しますか？', {
    icon: '⚠',
    danger: true,
    confirm: () => doDeleteRecord(logID),
    confirmLabel: '削除する',
    cancelLabel: 'キャンセル'
  });
}
function doDeleteRecord(logID) {
  gas('api_deleteStopRecord', { logID: logID }).then(res => {
    if (!res || !res.success) {
      showModal('削除失敗: ' + ((res && res.error) || '通信エラー'), '⚠');
      return;
    }
    STATE.stopRecords = (STATE.stopRecords || []).filter(r => r.logID !== logID);
    renderRecordList();
  }).catch(err => showModal('通信エラー: ' + (err.message || err), '⚠'));
}

// =====================================================
//  Wake Lock（画面オフ防止）— 1時間で自動解除（UIなし、サイレント動作）
// =====================================================
const WAKE_LOCK_DURATION_MS = 60 * 60 * 1000;
let wakeLock = null;
let wakeLockDeadline = 0;

function isWakeLockSupported() {
  return 'wakeLock' in navigator;
}

async function acquireWakeLock() {
  if (Date.now() >= wakeLockDeadline) return;
  if (!isWakeLockSupported()) return;
  if (wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) {
    // 低電力モード/端末拒否は無視（サイレント）
  }
}

function startWakeLock() {
  if (!isWakeLockSupported()) return;
  wakeLockDeadline = Date.now() + WAKE_LOCK_DURATION_MS;
  acquireWakeLock();
  setTimeout(() => {
    wakeLockDeadline = 0;
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }, WAKE_LOCK_DURATION_MS);
}

// 入力中の値を壊さずに STATE と DOM を更新する
function softMerge(detail) {
  STATE.cycle = detail.cycle;
  STATE.masters = detail.masters || STATE.masters || { equipment: [], reason: [], action: [] };
  if (detail.masters) saveCachedMasters(STATE.masters);
  if (detail.products) {
    STATE.products = detail.products;
    saveCachedProducts(STATE.products);
  }

  // datalist は別要素なので安全に差し替え可能
  fillDatalist('equipment-list', STATE.masters.equipment);
  fillDatalist('reason-list', STATE.masters.reason);
  fillDatalist('action-list', STATE.masters.action);

  // 製造開始 時:分: focus 中はスキップ
  const startH = document.getElementById('prod-start-hour');
  const startM = document.getElementById('prod-start-minute');
  const ae = document.activeElement;
  if (startH && startM && ae !== startH && ae !== startM) {
    setTimePair('prod-start-hour', 'prod-start-minute',
      detail.cycle.productionStartAt ? hhmm(detail.cycle.productionStartAt) : '', true);
  }
  // 製造終了 月/日/時:分: いずれかが focus 中ならスキップ
  const endM = document.getElementById('prod-end-month');
  const endD = document.getElementById('prod-end-day');
  const endH = document.getElementById('prod-end-hour');
  const endMi = document.getElementById('prod-end-minute');
  if (endM && endD && endH && endMi &&
      ae !== endM && ae !== endD && ae !== endH && ae !== endMi) {
    if (detail.cycle.productionEndAt) {
      const d = new Date(detail.cycle.productionEndAt);
      endM.value = d.getMonth() + 1;
      endD.value = d.getDate();
      setTimePair('prod-end-hour', 'prod-end-minute', hhmm(detail.cycle.productionEndAt), true);
    } else {
      setTimePair('prod-end-hour', 'prod-end-minute', '', true);
    }
  }

  // 停止記録一覧: 行内フィールド編集中ならスキップ（次回反映）
  STATE.stopRecords = detail.stopRecords || [];
  const activeIsRecord = ae && ae.classList && ae.classList.contains('record-field');
  if (!activeIsRecord) {
    renderRecordList();
  }

  // 商品セレクタを更新（停止記録ごとの商品バッジは renderRecordList で更新）
  if (detail.lastProducts) STATE.lastProducts = detail.lastProducts;
  if ('userEmail' in detail) STATE.userEmail = detail.userEmail || '';
  populateCycleProductSelect();
  updateConfirmUI();
}

// =====================================================
//  初期化
// =====================================================
window.addEventListener('DOMContentLoaded', () => {
  if (!CYCLE_ID) { goBack(); return; }

  // localStorage キャッシュから即座に datalist を埋める（ネット待ち回避）
  const cachedMasters = loadCachedMasters();
  if (cachedMasters) {
    STATE.masters = cachedMasters;
    fillDatalist('equipment-list', cachedMasters.equipment || []);
    fillDatalist('reason-list',    cachedMasters.reason    || []);
    fillDatalist('action-list',    cachedMasters.action    || []);
  }
  STATE.products = loadCachedProducts();

  gas('api_getCycleDetail', CYCLE_ID).then(res => {
    if (!res.success) {
      document.body.innerHTML = `<div style="padding: 40px; text-align: center;">⚠ ${res.error}</div>`;
      return;
    }
    STATE.cycle = res.cycle;
    STATE.stopRecords = res.stopRecords || [];
    STATE.masters = res.masters || { equipment: [], reason: [], action: [] };
    saveCachedMasters(STATE.masters);
    if (res.products) {
      STATE.products = res.products;
      saveCachedProducts(STATE.products);
    }
    if (res.lastProducts) STATE.lastProducts = res.lastProducts;
    STATE.userEmail = res.userEmail || '';
    renderAll();
    startAutoRefresh();
    startWakeLock();
  }).catch(err => {
    document.body.innerHTML = `<div style="padding: 40px;">⚠ 取得失敗: ${err.message}</div>`;
  });

  // 画面が表に戻ったら即時更新 + WakeLock 再取得（1時間内なら）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      pollUpdate();
      acquireWakeLock();
      tickStopTimeNow();
    }
  });

  // +停止 バーの月日時分を 30秒ごとに現在時刻に追従（マニュアル編集中はスキップ）
  setInterval(tickStopTimeNow, 30 * 1000);

  // 入力中はインジケータをグレーに戻す（青→グレー→保存時に黄→青）
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t.classList || !t.classList.contains('record-field')) return;
    const lid = t.dataset.logId;
    const field = t.dataset.field;
    if (!lid || !field) return;
    const ind = findInd(lid, field);
    if (ind) ind.className = 'rec-ind';
  });

  // タブレット: フォーム外のタップでアクティブ入力を blur（保存を確定 + 自動更新を再開）
  const blurOnOutsideTap = (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('input, select, textarea, button, .radio-option, label, datalist, option')) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) {
      ae.blur();
    }
  };
  document.addEventListener('touchstart', blurOnOutsideTap, { passive: true });
  document.addEventListener('mousedown',  blurOnOutsideTap);
});

// =====================================================
//  描画
// =====================================================
function renderAll() {
  const c = STATE.cycle;
  // タイトルバー
  const titleEl = document.getElementById('cycle-title');
  titleEl.className = 'cycle-title line-' + c.line;
  const md = c.productionDate.split('-');
  titleEl.innerHTML = `
    <span class="line-badge">${c.line}</span>
    <span class="date">${parseInt(md[1],10)}/${parseInt(md[2],10)}</span>
    <span class="id">${c.cycleID}</span>`;

  // 製造開始/終了の初期化
  initProdTimes();

  // 商品セレクタ（行ごとの商品バッジは renderRecordList で描画）
  populateCycleProductSelect();

  // 停止記録 追加フォームの初期化
  initStopForm();

  // 確定UI（読み取り専用モード切替も含む）
  updateConfirmUI();

  // 一覧描画
  renderRecordList();

  // datalist
  fillDatalist('equipment-list', STATE.masters.equipment);
  fillDatalist('reason-list', STATE.masters.reason);
  fillDatalist('action-list', STATE.masters.action);
}

function fillDatalist(id, items) {
  document.getElementById(id).innerHTML = (items || []).map(v => `<option value="${escapeHtml(v)}">`).join('');
}

// =====================================================
//  製造時間（開始/終了）
// =====================================================
function initProdTimes() {
  const c = STATE.cycle;
  const md = c.productionDate.split('-');

  // 開始日の表示（製造日）
  document.getElementById('prod-start-date-display').textContent =
    parseInt(md[1], 10) + '/' + parseInt(md[2], 10);

  // 開始: 時:分（空可）
  setTimePair('prod-start-hour', 'prod-start-minute',
    c.productionStartAt ? hhmm(c.productionStartAt) : '', true);
  // 終了: 月/日/時:分（空可）
  buildSelect('prod-end-month', range(1, 12), null);
  buildSelect('prod-end-day',   range(1, 31), null);
  if (c.productionEndAt) {
    const d = new Date(c.productionEndAt);
    document.getElementById('prod-end-month').value = d.getMonth() + 1;
    document.getElementById('prod-end-day').value = d.getDate();
    setTimePair('prod-end-hour', 'prod-end-minute', hhmm(c.productionEndAt), true);
  } else {
    document.getElementById('prod-end-month').value = parseInt(md[1], 10);
    document.getElementById('prod-end-day').value = parseInt(md[2], 10);
    setTimePair('prod-end-hour', 'prod-end-minute', '', true);
  }
}

function onProdStartChange() {
  const t = readTimePair(
    document.getElementById('prod-start-hour'),
    document.getElementById('prod-start-minute')
  );
  if (!t) return;
  // 製造日 + 時刻
  const iso = STATE.cycle.productionDate + 'T' + t + ':00';
  setSaveIndicator('start-save', 'saving', '保存中…');
  gas('api_updateCycleField', {
    cycleID: STATE.cycle.cycleID, field: 'productionStartAt', value: iso
  }).then(res => {
    if (res.success) {
      STATE.cycle.productionStartAt = iso;
      setSaveIndicator('start-save', 'saved', '保存しました');
    } else {
      setSaveIndicator('start-save', 'error', res.error || 'エラー');
    }
  }).catch(err => setSaveIndicator('start-save', 'error', err.message));
}

function onProdEndChange() {
  const y = STATE.cycle.productionDate.slice(0, 4);
  const m = parseInt(document.getElementById('prod-end-month').value, 10);
  const d = parseInt(document.getElementById('prod-end-day').value, 10);
  const t = readTimePair(
    document.getElementById('prod-end-hour'),
    document.getElementById('prod-end-minute')
  );

  // 時刻が空 → 終了を解除
  if (!t) {
    setSaveIndicator('end-save', 'saving', '保存中…');
    gas('api_updateCycleField', {
      cycleID: STATE.cycle.cycleID, field: 'productionEndAt', value: ''
    }).then(res => {
      if (res.success) {
        STATE.cycle.productionEndAt = '';
        setSaveIndicator('end-save', 'saved', '保存');
      } else {
        setSaveIndicator('end-save', 'error', res.error || 'エラー');
      }
    }).catch(err => setSaveIndicator('end-save', 'error', err.message));
    return;
  }

  // 存在しない日付チェック
  const test = new Date(parseInt(y, 10), m - 1, d);
  if (test.getMonth() !== m - 1) {
    setSaveIndicator('end-save', 'error', `${m}/${d}は存在しません`);
    return;
  }
  const iso = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T' + t + ':00';
  setSaveIndicator('end-save', 'saving', '保存中…');
  gas('api_updateCycleField', {
    cycleID: STATE.cycle.cycleID, field: 'productionEndAt', value: iso
  }).then(res => {
    if (res.success) {
      STATE.cycle.productionEndAt = iso;
      setSaveIndicator('end-save', 'saved', '保存');
    } else {
      setSaveIndicator('end-save', 'error', res.error || 'エラー');
    }
  }).catch(err => setSaveIndicator('end-save', 'error', err.message));
}

function setSaveIndicator(id, state) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'save-indicator' + (state ? ' ' + state : '');
}

// =====================================================
//  停止記録 追加フォーム（Step 1）
// =====================================================
function initStopForm() {
  const now = new Date();
  buildSelect('stop-day-month', range(1, 12), now.getMonth() + 1);
  buildSelect('stop-day-day',   range(1, 31), now.getDate());
  setTimePair('stop-stop-hour', 'stop-stop-minute',
    String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
    false);
  stopTimeManual = false;

  // 追加バーの 月/日/時/分 を「触ったらマニュアル」と検出
  ['stop-day-month', 'stop-day-day', 'stop-stop-hour', 'stop-stop-minute'].forEach(id => {
    const el = document.getElementById(id);
    if (el && !el._tagged) {
      el.addEventListener('change', () => { stopTimeManual = true; });
      el._tagged = true;
    }
  });
}

// 30秒ごとに +停止 の現在日時を更新（マニュアル編集中はスキップ）
function tickStopTimeNow() {
  if (stopTimeManual) return;
  const ae = document.activeElement;
  const ids = ['stop-day-month', 'stop-day-day', 'stop-stop-hour', 'stop-stop-minute'];
  if (ids.some(id => ae === document.getElementById(id))) return;
  const now = new Date();
  const setIfExists = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.value = v;
  };
  setIfExists('stop-day-month',  now.getMonth() + 1);
  setIfExists('stop-day-day',    now.getDate());
  setIfExists('stop-stop-hour',  now.getHours());
  setIfExists('stop-stop-minute', now.getMinutes());
}

function addStopRecord() {
  const errEl = document.getElementById('stop-error');
  errEl.style.display = 'none';

  const m = parseInt(document.getElementById('stop-day-month').value, 10);
  const d = parseInt(document.getElementById('stop-day-day').value, 10);
  const stopTime = readTimePair(
    document.getElementById('stop-stop-hour'),
    document.getElementById('stop-stop-minute')
  );
  if (!stopTime) {
    errEl.textContent = 'ストップ時刻を入力してください';
    errEl.style.display = 'block';
    return;
  }

  const yearStr = STATE.cycle.productionDate.slice(0, 4);
  const test = new Date(parseInt(yearStr, 10), m - 1, d);
  if (test.getMonth() !== m - 1) {
    errEl.textContent = m + '/' + d + 'は存在しない日付です';
    errEl.style.display = 'block';
    return;
  }
  const stopDateStr = yearStr + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  const stopIso = stopDateStr + 'T' + stopTime + ':00';

  const btn = document.getElementById('stop-add-btn');
  btn.disabled = true;

  gas('api_addStopRecord', {
    cycleID: STATE.cycle.cycleID,
    stopAt: stopIso,
    startAt: '',
    equipment: '', reason: '', action: '', charge: '', crEntry: '無',
    wastage: 0, ufTemp: '', teaTemp: '',
    recordDept: localStorage.getItem('user_department') || ''
  }).then(res => {
    btn.disabled = false;
    if (!res.success) {
      errEl.textContent = res.error || '追加失敗';
      errEl.style.display = 'block';
      return;
    }
    // 追加成功 → マニュアルフラグ解除 + 現在時刻に再設定
    stopTimeManual = false;
    tickStopTimeNow();
    return gas('api_getCycleDetail', STATE.cycle.cycleID).then(detail => {
      if (detail.success) {
        STATE.cycle = detail.cycle;
        STATE.stopRecords = detail.stopRecords;
        STATE.masters = detail.masters;
        renderRecordList();
        fillDatalist('equipment-list', STATE.masters.equipment);
        fillDatalist('reason-list', STATE.masters.reason);
        fillDatalist('action-list', STATE.masters.action);
        // 追加した行に自動スクロール（フォーカスは当てない＝自動更新を止めない）
        setTimeout(function() {
          var newItem = document.querySelector('[data-log-id="' + res.logID + '"]');
          if (newItem) newItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }
    });
  }).catch(err => {
    btn.disabled = false;
    errEl.textContent = '通信エラー: ' + err.message;
    errEl.style.display = 'block';
  });
}

// =====================================================
//  商品関連ヘルパー
// =====================================================
function lineProducts() {
  const line = STATE.cycle ? STATE.cycle.line : '';
  return (STATE.products || []).filter(p => !p.kind || p.kind === line);
}
function productName(id) {
  if (!id) return '';
  const p = (STATE.products || []).find(x => x.id === id);
  if (!p) return id;
  // 表示は通称優先、なければ名、それもなければ id
  return p.nickname || p.name || p.id;
}
// このサイクルの「ベース商品」: cycle.productID > lastProducts[line] > 空
function baseProductID() {
  if (!STATE.cycle) return '';
  if (STATE.cycle.productID) return STATE.cycle.productID;
  const line = STATE.cycle.line || '';
  return (STATE.lastProducts && STATE.lastProducts[line]) || '';
}
// 指定 stopAt 時点 (この stop の開始時) で有効な商品ID
//   - includeThis=true: この stop の newProductID も適用 (switch時 after を返す)
//   - includeThis=false: この stop の直前の商品 (switch時 before を返す)
function computeProductAt(stopAt, includeThis) {
  let current = baseProductID();
  const sorted = (STATE.stopRecords || []).slice().sort((a, b) =>
    a.stopAt < b.stopAt ? -1 : a.stopAt > b.stopAt ? 1 : 0
  );
  for (const r of sorted) {
    const cmp = new Date(r.stopAt) - new Date(stopAt);
    if (cmp > 0) break;
    if (cmp === 0 && !includeThis) break;
    if (r.newProductID) current = r.newProductID;
  }
  return current;
}
function productOptionsHtml(products, currentValue) {
  let opts = '<option value="">— 未選択 —</option>';
  products.forEach(p => {
    const sel = p.id === currentValue ? ' selected' : '';
    const label = p.nickname || p.name || p.id;
    opts += '<option value="' + escapeAttr(p.id) + '"' + sel + '>' + escapeHtml(label) + '</option>';
  });
  return opts;
}

function populateCycleProductSelect() {
  const sel = document.getElementById('cycle-product');
  if (!sel || !STATE.cycle) return;
  if (document.activeElement === sel) return;   // 編集中はスキップ
  // セレクタの初期値: cycle.productID があればそれ、なければ lastProducts[line]
  const initial = STATE.cycle.productID
    || (STATE.lastProducts && STATE.lastProducts[STATE.cycle.line])
    || '';
  sel.innerHTML = productOptionsHtml(lineProducts(), initial);
}

function saveCycleProduct() {
  const sel = document.getElementById('cycle-product');
  const val = sel ? sel.value : '';
  const line = STATE.cycle.line;
  setSaveIndicator('cycle-product-save', 'saving');
  Promise.all([
    gas('api_updateCycleField', { cycleID: STATE.cycle.cycleID, field: 'productID', value: val }),
    gas('api_setLastProduct',  { line: line, productID: val })
  ]).then(([res1, res2]) => {
    if (!res1.success || !res2.success) {
      setSaveIndicator('cycle-product-save', 'error');
      return;
    }
    STATE.cycle.productID = val;
    STATE.lastProducts[line] = val;
    setSaveIndicator('cycle-product-save', 'saved');
    renderRecordList();
  }).catch(() => setSaveIndicator('cycle-product-save', 'error'));
}

// =====================================================
//  日報確定 (権限管理シート未整備のため、編集ロックは無し)
// =====================================================
function updateConfirmUI() {
  const c = STATE.cycle;
  const area = document.getElementById('confirm-area');
  if (!c || !area) return;
  const isConfirmed = !!c.confirmedAt;
  if (!isConfirmed) {
    area.innerHTML = '<button class="btn-confirm" onclick="confirmCycle()">日報を確定</button>';
  } else {
    const dt = new Date(c.confirmedAt);
    const ds = (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + hhmmFromDate(dt);
    const by = c.confirmedBy || '';
    area.innerHTML = '<span class="confirm-badge" title="' + escapeAttr(by) + '">✓ 確定済 ' + ds + '</span>';
  }
}

function confirmCycle() {
  if (!STATE.cycle) return;
  gas('api_confirmCycle', { cycleID: STATE.cycle.cycleID }).then(res => {
    if (!res.success) {
      const msg = res.validationErrors
        ? '未入力があります:\n\n' + res.validationErrors.join('\n')
        : (res.error || '確定失敗');
      showModal(msg, '⚠');
      return;
    }
    STATE.cycle.confirmedAt = res.confirmedAt;
    STATE.cycle.confirmedBy = res.confirmedBy;
    updateConfirmUI();
    showModal('日報を確定しました。', '✓');
  }).catch(err => showModal('通信エラー: ' + (err.message || err), '⚠'));
}

//  停止記録一覧（各行に全フィールドをインライン表示）

    list.innerHTML = '<div class="empty-records">まだ停止記録はありません</div>';

  const records = STATE.stopRecords.slice().reverse();
  const monthOpts = range(1, 12).map(n => `<option value="${n}">${n}</option>`).join('');
  const dayOpts   = range(1, 31).map(n => `<option value="${n}">${n}</option>`).join('');
  list.innerHTML = records.map((r) => {
    const stop = new Date(r.stopAt);
    const stopStr = hhmmFromDate(stop);
    const stopMonth = stop.getMonth() + 1;
    const stopDay = stop.getDate();
    const hasStart = !!r.startAt;
    const startVal = hasStart ? hhmmFromDate(new Date(r.startAt)) : '';
    const minutesStr = hasStart ? (r.minutes || 0) + '分' : '—';
    const lid = escapeAttr(r.logID);
    const cr = r.crEntry || '無';   // 空なら 無 をデフォルトに
    const isCrYes = cr === '有';
    const isCrNo  = cr === '無';
    const startDateStr = hasStart ? mdFromDate(new Date(r.startAt)) : '';
    const stopDateStr = mdFromDate(stop);
    const showStartDate = hasStart && startDateStr !== stopDateStr;
    const monthOptsSel = monthOpts.replace(`value="${stopMonth}"`, `value="${stopMonth}" selected`);
    const dayOptsSel   = dayOpts.replace(`value="${stopDay}"`,     `value="${stopDay}" selected`);
    // ライン判定 (500ml はフィラー温度のみ、TEA温度を非表示)
    const is500ml = STATE.cycle.line === '500ml';
    // 商品切替 判定 / この行の商品（切替後 or 前）
    const eqStr = String(r.equipment || '');
    const isSwitch = eqStr.indexOf('品種切替') !== -1 || eqStr.indexOf('商品切替') !== -1;
    const beforeProductID = isSwitch ? computeProductAt(r.stopAt, false) : '';
    const beforeProductName = productName(beforeProductID);
    const switchProductOpts = isSwitch ? productOptionsHtml(lineProducts(), r.newProductID || '') : '';
    const activeProductName = productName(computeProductAt(r.stopAt, true));
    const stopHour = stop.getHours();
    const stopMin  = stop.getMinutes();
    const startHr  = hasStart ? new Date(r.startAt).getHours() : '';
    const startMn  = hasStart ? new Date(r.startAt).getMinutes() : '';
    // 商品バッジ部分: switch なら "before [青] → [select]"、それ以外は単独表示
    const productCell = isSwitch
      ? `<span class="record-product ${beforeProductName ? '' : 'empty'}">${escapeHtml(beforeProductName || '—')}</span>
         <span class="record-product-arrow">→</span>
         <select class="record-product-select record-field"
           data-log-id="${lid}" data-field="newProductID"
           onchange="saveRecordField('${lid}', 'newProductID', this.value)">

    return `
      <div class="record-item ${hasStart ? '' : 'unfinished'}" data-log-id="${lid}">
        <div class="record-header">
          <select class="rec-stop-month record-field" data-log-id="${lid}" data-field="stopMonth" onchange="saveRecordStopAt('${lid}')">${monthOptsSel}</select>
          <span class="rec-stop-slash">/</span>
          <select class="rec-stop-day record-field" data-log-id="${lid}" data-field="stopDay" onchange="saveRecordStopAt('${lid}')">${dayOptsSel}</select>
          <span class="time-pair">
            <select class="record-field" data-log-id="${lid}" data-field="stopHour" onchange="saveRecordStopAt('${lid}')">${hourOptionsHtml(stopHour, false)}</select>
            <span class="colon">:</span>
            <select class="record-field" data-log-id="${lid}" data-field="stopMinute" onchange="saveRecordStopAt('${lid}')">${minuteOptionsHtml(stopMin, false)}</select>
          </span>
          <span class="rec-ind" data-ind="${lid}-stopAt"></span>
          <span class="arrow">→</span>
          ${showStartDate ? `<span class="record-date">${startDateStr}</span>` : ''}
          <span class="time-pair">
            <select class="record-field" data-log-id="${lid}" data-field="startHour" onchange="saveRecordStartTime('${lid}')">${hourOptionsHtml(startHr, true)}</select>
            <span class="colon">:</span>
            <select class="record-field" data-log-id="${lid}" data-field="startMinute" onchange="saveRecordStartTime('${lid}')">${minuteOptionsHtml(startMn, true)}</select>
          </span>
          <span class="rec-ind" data-ind="${lid}-startTime"></span>
          <span class="record-minutes ${hasStart ? '' : 'pending'}" data-min="${lid}">${minutesStr}</span>
          ${productCell}
        </div>
        <div class="record-body">
        <div class="record-fields-grid">
          <div>
            <div class="field-label">停止設備</div>
            <div class="field-input-wrap">
              <input type="text" class="record-field" list="equipment-list"
                data-log-id="${lid}" data-field="equipment"
                placeholder="選択or入力"

                onblur="saveRecordField('${lid}', 'equipment', this.value)">

          <div>
            <div class="field-label">対応内容</div>
            <div class="field-input-wrap">

              <input type="number" class="record-field" step="0.1"

                <div class="radio-option ${isCrNo ? 'selected' : ''}"  data-value="無" onclick="selectRecordRadio(this, '${lid}')">無</div>
              </div>
              <span class="rec-ind" data-ind="${lid}-crEntry"></span>
            </div>
          </div>
          <div>
            <div class="field-label">廃棄本数</div>
            <div class="field-input-wrap">
              <input type="number" class="record-field" min="0" placeholder="0"
                data-log-id="${lid}" data-field="wastage"
                value="${r.wastage || ''}"
                onblur="saveRecordField('${lid}', 'wastage', this.value)">
              <span class="rec-ind" data-ind="${lid}-wastage"></span>
            </div>
          </div>
        </div>
        <button class="record-delete-btn" onclick="confirmDeleteRecord('${lid}')">削除</button>
        </div>
      </div>`;
  }).join('');
}

function findInd(logID, fieldKey) {
  return document.querySelector('[data-ind="' + logID + '-' + fieldKey + '"]');
}

function setRecInd(el, state) {
  if (!el) return;
  el.className = 'rec-ind' + (state ? ' ' + state : '');
}

function saveRecordField(logID, fieldKey, value) {
  const indEl = findInd(logID, fieldKey);
  setRecInd(indEl, 'saving', '保存中…');

  if (fieldKey === 'startTime') {
    gas('api_updateStopRecordEnd', { logID: logID, startTime: value }).then(function(res) {
      if (!res.success) { setRecInd(indEl, 'error', res.error || 'エラー'); return; }
      setRecInd(indEl, 'saved', '保存');
      const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
      if (rec) { rec.startAt = res.startAt; rec.minutes = res.minutes; }
      const minEl = document.querySelector('[data-min="' + logID + '"]');
      if (minEl) {
        if (value) {
          minEl.textContent = (res.minutes || 0) + '分';
          minEl.classList.remove('pending');
        } else {
          minEl.textContent = '—';
          minEl.classList.add('pending');
        }
      }
      const item = document.querySelector('.record-item[data-log-id="' + logID + '"]');
      if (item) item.classList.toggle('unfinished', !value);
    }).catch(function(err) { setRecInd(indEl, 'error', err.message); });
    return;
  }

  const trimmed = (typeof value === 'string') ? value.trim() : value;
  const fields = {};
  fields[fieldKey] = trimmed;
  gas('api_updateStopRecordFields', { logID: logID, fields: fields }).then(function(res) {
    if (!res.success) { setRecInd(indEl, 'error', res.error || 'エラー'); return; }
    setRecInd(indEl, 'saved', '保存');
    const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
    if (rec) rec[fieldKey] = trimmed;
    // 商品切替の保存 or 停止設備変更時は再描画して各行の商品バッジを更新
    if (fieldKey === 'newProductID' || fieldKey === 'equipment') {
      renderRecordList();
    }
  }).catch(function(err) { setRecInd(indEl, 'error', err.message); });
}

function saveRecordStopAt(logID) {
  const card = document.querySelector('.record-item[data-log-id="' + logID + '"]');
  if (!card) return;
  const m = parseInt(card.querySelector('[data-field="stopMonth"]').value, 10);
  const d = parseInt(card.querySelector('[data-field="stopDay"]').value, 10);
  const t = readTimePair(
    card.querySelector('[data-field="stopHour"]'),
    card.querySelector('[data-field="stopMinute"]')
  );
  const indEl = findInd(logID, 'stopAt');
  if (!t) { setRecInd(indEl, 'error'); return; }
  const yearStr = STATE.cycle.productionDate.slice(0, 4);
  const test = new Date(parseInt(yearStr, 10), m - 1, d);
  if (test.getMonth() !== m - 1) { setRecInd(indEl, 'error'); return; }
  const stopIso = yearStr + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T' + t + ':00';

  setRecInd(indEl, 'saving');
  gas('api_updateStopRecordStop', { logID: logID, stopAt: stopIso }).then(function(res) {
    if (!res.success) { setRecInd(indEl, 'error'); return; }
    setRecInd(indEl, 'saved');
    const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
    if (rec) {
      rec.stopAt = res.stopAt;
      if (res.startAt) rec.startAt = res.startAt;
      rec.minutes = res.minutes;
    }
    const minEl = document.querySelector('[data-min="' + logID + '"]');
    if (minEl) {
      if (rec && rec.startAt) {
        minEl.textContent = (res.minutes || 0) + '分';
        minEl.classList.remove('pending');
      } else {
        minEl.textContent = '—';
        minEl.classList.add('pending');
      }
    }
  }).catch(function(err) { setRecInd(indEl, 'error'); });
}

function saveRecordStartTime(logID) {
  const card = document.querySelector('.record-item[data-log-id="' + logID + '"]');
  if (!card) return;
  const t = readTimePair(
    card.querySelector('[data-field="startHour"]'),
    card.querySelector('[data-field="startMinute"]')
  );
  saveRecordField(logID, 'startTime', t);
}

function selectRecordRadio(el, logID) {
  const group = el.parentElement;
  group.querySelectorAll('.radio-option').forEach(function(d) { d.classList.remove('selected'); });
  el.classList.add('selected');
  saveRecordField(logID, 'crEntry', el.dataset.value);
}

function escapeAttr(s) {
  return String(s || '').replace(/"/g, '&quot;');
}

// =====================================================
//  ユーティリティ
// =====================================================
function goBack() { window.top.location.href = APP_URL; }

function buildSelect(id, values, selected) {
  const el = document.getElementById(id);
  el.innerHTML = values.map(v =>
    `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`
  ).join('');
}

function hourOptionsHtml(selectedHour, allowEmpty) {
  let opts = allowEmpty ? '<option value="">—</option>' : '';
  for (let h = 0; h <= 23; h++) {
    const padded = String(h).padStart(2, '0');
    const sel = (selectedHour !== '' && selectedHour !== null && selectedHour !== undefined && Number(selectedHour) === h) ? ' selected' : '';
    opts += '<option value="' + h + '"' + sel + '>' + padded + '</option>';
  }
  return opts;
}
function minuteOptionsHtml(selectedMinute, allowEmpty) {
  let opts = allowEmpty ? '<option value="">—</option>' : '';
  for (let m = 0; m <= 59; m++) {
    const padded = String(m).padStart(2, '0');
    const sel = (selectedMinute !== '' && selectedMinute !== null && selectedMinute !== undefined && Number(selectedMinute) === m) ? ' selected' : '';
    opts += '<option value="' + m + '"' + sel + '>' + padded + '</option>';
  }
  return opts;
}
// 時:分 セレクタペアから "HH:MM" 文字列を生成（どちらか空なら空文字を返す）
function readTimePair(hourSel, minSel) {
  const h = hourSel ? hourSel.value : '';
  const m = minSel ? minSel.value : '';
  if (h === '' || m === '') return '';
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function setTimePair(hourSelId, minSelId, hhmm, allowEmpty) {
  const hEl = document.getElementById(hourSelId);
  const mEl = document.getElementById(minSelId);
  let h = '', m = '';
  if (hhmm && /^(\d{1,2}):(\d{1,2})/.test(hhmm)) {
    const parts = hhmm.match(/^(\d{1,2}):(\d{1,2})/);
    h = parseInt(parts[1], 10);
    m = parseInt(parts[2], 10);
  }
  if (hEl) hEl.innerHTML = hourOptionsHtml(h, allowEmpty);
  if (mEl) mEl.innerHTML = minuteOptionsHtml(m, allowEmpty);
}
function range(from, to) {
  const arr = [];
  for (let i = from; i <= to; i++) arr.push(i);
  return arr;
}
function hhmm(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function hhmmFromDate(d) {
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function mdFromDate(d) {
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
