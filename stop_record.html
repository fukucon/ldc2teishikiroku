            <div class="field-label">廃棄本数</div>
            <div class="field-input-wrap${wastageDisplay(r) === '' ? ' wrap-empty' : ''}">
              <input type="text" class="record-field" inputmode="numeric" placeholder="0"
                data-ac="wastage"
                data-log-id="${lid}" data-field="wastage"
                value="${wastageDisplay(r)}"
                onblur="saveRecordField('${lid}', 'wastage', this.value)">
              <span class="rec-ind" data-ind="${lid}-wastage"></span>
              ${MARK}
            </div>
          </div>
          <button class="record-delete-btn" onclick="confirmDeleteRecord('${lid}')">削除</button>
        </div>
      </div>`;
  }).join('');
  updateMissingCount();
}

function findInd(logID, fieldKey) {
  return document.querySelector('[data-ind="' + logID + '-' + fieldKey + '"]');
}

function setRecInd(el, state) {
  if (!el) return;
  el.className = 'rec-ind' + (state ? ' ' + state : '');
}

function saveRecordField(logID, fieldKey, value) {
  const indEl = findInd(logID, fieldKey);
  setRecInd(indEl, 'saving', '保存中…');
  pendingRecordSaves++;
  lastRecordInteractionAt = Date.now();
  const releaseLock = function() { pendingRecordSaves = Math.max(0, pendingRecordSaves - 1); };

  if (fieldKey === 'startTime') {
    gas('api_updateStopRecordEnd', { logID: logID, startTime: value }).then(function(res) {
      if (!res.success) { setRecInd(indEl, 'error', res.error || 'エラー'); return; }
      setRecInd(indEl, 'saved', '保存');
      const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
      if (rec) { rec.startAt = res.startAt; rec.minutes = res.minutes; }
      const minEl = document.querySelector('[data-min="' + logID + '"]');
      if (minEl) {
        if (value) {
          minEl.textContent = (res.minutes || 0) + '分';
          minEl.classList.remove('pending');
        } else {
          minEl.textContent = '—';
          minEl.classList.add('pending');
        }
      }
      const item = document.querySelector('.record-item[data-log-id="' + logID + '"]');
      if (item) item.classList.toggle('unfinished', !value);
    }).catch(function(err) { setRecInd(indEl, 'error', err.message); })
      .then(releaseLock, releaseLock);
    return;
  }

  let trimmed = (typeof value === 'string') ? value.trim() : value;
  // 廃棄本数: 「—」や非数値は 0 に正規化して保存
  if (fieldKey === 'wastage') {
    const n = parseInt(trimmed, 10);
    trimmed = isNaN(n) ? '0' : String(n);
  }
  // MF/TEA温度: 全角/半角ハイフンや長音記号など紛らわしい入力を「－」に正規化
  //   （明示的に「測定対象外」として記録。未入力の空欄とは区別され、!マークも出ない）
  if (fieldKey === 'ufTemp' || fieldKey === 'teaTemp') {
    trimmed = normalizeTempValue(trimmed);
  }
  const fields = {};
  fields[fieldKey] = trimmed;

  // 商品切替で newProductID が選ばれたら、対応内容を "旧→新" に自動入力
  //   - 対応内容が空 or 既存の "X→Y" 形式なら上書き（手書き入力は保護）
  let autoAction = null;
  if (fieldKey === 'newProductID') {
    const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
    if (rec) {
      const beforeName = productName(computeProductAt(rec.stopAt, false));
      const afterName  = productName(trimmed);
      if (beforeName && afterName) {
        const cur = (rec.action || '').trim();
        const isAutoFormat = /^.+\s*→\s*.+$/.test(cur);
        if (!cur || isAutoFormat) {
          autoAction = beforeName + '→' + afterName;
          fields.action = autoAction;
        }
      }
    }
  }

  gas('api_updateStopRecordFields', { logID: logID, fields: fields }).then(function(res) {
    if (!res.success) { setRecInd(indEl, 'error', res.error || 'エラー'); return; }
    setRecInd(indEl, 'saved', '保存');
    const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
    if (rec) {
      rec[fieldKey] = trimmed;
      if (autoAction !== null) rec.action = autoAction;
    }
    // MF/TEA温度: 正規化後の値（－ 等）を入力欄とダッシュボタンに反映
    if (fieldKey === 'ufTemp' || fieldKey === 'teaTemp') {
      const inputEl = document.querySelector(
        '.record-field[data-log-id="' + logID + '"][data-field="' + fieldKey + '"]'
      );
      if (inputEl) {
        inputEl.value = trimmed;
        const btn = inputEl.parentElement && inputEl.parentElement.querySelector('.dash-btn');
        if (btn) btn.classList.toggle('active', trimmed === TEMP_DASH);
      }
    }
    // 商品切替の保存 or 停止設備変更時は再描画して各行の商品バッジを更新
    if (fieldKey === 'newProductID' || fieldKey === 'equipment') {
      renderRecordList();
    }
  }).catch(function(err) { setRecInd(indEl, 'error', err.message); })
    .then(releaseLock, releaseLock);
}

function saveRecordStopAt(logID) {
  const card = document.querySelector('.record-item[data-log-id="' + logID + '"]');
  if (!card) return;
  const m = parseInt(card.querySelector('[data-field="stopMonth"]').value, 10);
  const d = parseInt(card.querySelector('[data-field="stopDay"]').value, 10);
  const t = readTimePair(
    card.querySelector('[data-field="stopHour"]'),
    card.querySelector('[data-field="stopMinute"]')
  );
  const indEl = findInd(logID, 'stopAt');
  if (!t) { setRecInd(indEl, 'error'); return; }
  const yearStr = STATE.cycle.productionDate.slice(0, 4);
  const test = new Date(parseInt(yearStr, 10), m - 1, d);
  if (test.getMonth() !== m - 1) { setRecInd(indEl, 'error'); return; }
  const stopIso = yearStr + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') + 'T' + t + ':00';

  setRecInd(indEl, 'saving');
  gas('api_updateStopRecordStop', { logID: logID, stopAt: stopIso }).then(function(res) {
    if (!res.success) { setRecInd(indEl, 'error'); return; }
    setRecInd(indEl, 'saved');
    const rec = STATE.stopRecords.find(function(r) { return r.logID === logID; });
    if (rec) {
      rec.stopAt = res.stopAt;
      if (res.startAt) rec.startAt = res.startAt;
      rec.minutes = res.minutes;
    }
    const minEl = document.querySelector('[data-min="' + logID + '"]');
    if (minEl) {
      if (rec && rec.startAt) {
        minEl.textContent = (res.minutes || 0) + '分';
        minEl.classList.remove('pending');
      } else {
        minEl.textContent = '—';
        minEl.classList.add('pending');
      }
    }
  }).catch(function(err) { setRecInd(indEl, 'error'); });
}

function saveRecordStartTime(logID) {
  const card = document.querySelector('.record-item[data-log-id="' + logID + '"]');
  if (!card) return;
  const t = readTimePair(
    card.querySelector('[data-field="startHour"]'),
    card.querySelector('[data-field="startMinute"]')
  );
  saveRecordField(logID, 'startTime', t);
}

// 「現」ボタン: 現在時刻 (時:分) を スタート時間 に入れて保存
function setRecordStartNow(logID) {
  const card = document.querySelector('.record-item[data-log-id="' + logID + '"]');
  if (!card) return;
  const hSel = card.querySelector('[data-field="startHour"]');
  const mSel = card.querySelector('[data-field="startMinute"]');
  if (!hSel || !mSel) return;
  const now = new Date();
  hSel.value = String(now.getHours());
  mSel.value = String(now.getMinutes());
  saveRecordStartTime(logID);
}

function selectRecordRadio(el, logID) {
  const group = el.parentElement;
  group.querySelectorAll('.radio-option').forEach(function(d) { d.classList.remove('selected'); });
  el.classList.add('selected');
  saveRecordField(logID, 'crEntry', el.dataset.value);
}

function escapeAttr(s) {
  return String(s || '').replace(/"/g, '&quot;');
}

// =====================================================
//  ユーティリティ
// =====================================================
function goBack() { window.top.location.href = APP_URL; }

function buildSelect(id, values, selected) {
  const el = document.getElementById(id);
  el.innerHTML = values.map(v =>
    `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`
  ).join('');
}

function hourOptionsHtml(selectedHour, allowEmpty) {
  let opts = allowEmpty ? '<option value="">—</option>' : '';
  for (let h = 0; h <= 23; h++) {
    const padded = String(h).padStart(2, '0');
    const sel = (selectedHour !== '' && selectedHour !== null && selectedHour !== undefined && Number(selectedHour) === h) ? ' selected' : '';
    opts += '<option value="' + h + '"' + sel + '>' + padded + '</option>';
  }
  return opts;
}
function minuteOptionsHtml(selectedMinute, allowEmpty) {
  let opts = allowEmpty ? '<option value="">—</option>' : '';
  for (let m = 0; m <= 59; m++) {
    const padded = String(m).padStart(2, '0');
    const sel = (selectedMinute !== '' && selectedMinute !== null && selectedMinute !== undefined && Number(selectedMinute) === m) ? ' selected' : '';
    opts += '<option value="' + m + '"' + sel + '>' + padded + '</option>';
  }
  return opts;
}
// 時:分 セレクタペアから "HH:MM" 文字列を生成（どちらか空なら空文字を返す）
function readTimePair(hourSel, minSel) {
  const h = hourSel ? hourSel.value : '';
  const m = minSel ? minSel.value : '';
  if (h === '' || m === '') return '';
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
function setTimePair(hourSelId, minSelId, hhmm, allowEmpty) {
  const hEl = document.getElementById(hourSelId);
  const mEl = document.getElementById(minSelId);
  let h = '', m = '';
  if (hhmm && /^(\d{1,2}):(\d{1,2})/.test(hhmm)) {
    const parts = hhmm.match(/^(\d{1,2}):(\d{1,2})/);
    h = parseInt(parts[1], 10);
    m = parseInt(parts[2], 10);
  }
  if (hEl) hEl.innerHTML = hourOptionsHtml(h, allowEmpty);
  if (mEl) mEl.innerHTML = minuteOptionsHtml(m, allowEmpty);
}
function range(from, to) {
  const arr = [];
  for (let i = from; i <= to; i++) arr.push(i);
  return arr;
}
function hhmm(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function hhmmFromDate(d) {
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function mdFromDate(d) {
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
